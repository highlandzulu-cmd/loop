name: Probes

# Long probe tests (E1 recovery, E3 enforcement). They are #[ignore] in the
# normal test run. They use the `faux` provider: no model tokens, no network.
# They never open a GUI: the E3 harness switches off external diff windows and
# runs with a no-op diff editor, and the runner has no display.
#
# Not part of the PR gate. They run nightly (on the default branch) and on
# demand: Actions -> Probes -> Run workflow, pick a branch. Commands and
# results: docs/probes/e1-results.md and docs/probes/e3-results.md.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      e1_trials:
        description: "E1 trials (the full run in docs/probes/e1-results.md used 200)"
        type: string
        default: "50"
      seed:
        description: "Seed for E1 and E3"
        type: string
        default: "42"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same as ci.yml, so that the cache key matches the test job's cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  e1-recovery:
    name: E1 recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Restore the cache of the CI test job. Never save one here.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-ubuntu-latest
          save-if: false

      - name: E1 recoverable truth
        env:
          E1_TRIALS: ${{ inputs.e1_trials || '50' }}
          E1_SEED: ${{ inputs.seed || '42' }}
          E1_PARALLEL: "4"
          # Stop starting new trials after 10 minutes.
          E1_BUDGET_SECS: "600"
          E1_ROOT: ${{ runner.temp }}/e1
        run: |
          set -o pipefail
          cargo test -p loop-runtime --locked --test e1_recovery -- \
            --ignored --nocapture e1_recoverable_truth 2>&1 | tee "$RUNNER_TEMP/e1.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e1-log
          path: ${{ runner.temp }}/e1.log
          retention-days: 14
          if-no-files-found: ignore

  # E3 needs the `orchestration` feature (it has workflow cases).
  e3-enforcement:
    name: E3 enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-ubuntu-latest
          save-if: false

      - name: E3 enforcement
        env:
          E3_SEED: ${{ inputs.seed || '42' }}
        run: |
          set -o pipefail
          cargo test -p loop-runtime --features orchestration --locked --test e3_enforcement -- \
            --ignored --nocapture --test-threads=4 e3_enforcement 2>&1 | tee "$RUNNER_TEMP/e3.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e3-log
          path: ${{ runner.temp }}/e3.log
          retention-days: 14
          if-no-files-found: ignore
