name: Lint

# Static checks that never run the code: rustfmt (formatting) and clippy
# (likely bugs and bad patterns). Kept separate from ci.yml (build + test) so
# a lint failure never hides a real test result, and the other way round.
#
# Runs on pull requests and pushes to main, and can be started by hand from
# Actions -> Lint -> Run workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: nothing here needs to write to the repo.
permissions:
  contents: read

# A newer push to the same ref makes an older, still-running lint run pointless.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

  # The crates ci.yml builds and tests. loop-desktop is left out on purpose,
  # same as ci.yml: it pulls in the GUI stack, which needs system libraries
  # a stock runner doesn't have.
  LINT_PACKAGES: -p loop-ai -p loop-agent -p loop-mcp -p loop-orchestration -p loop-app-core -p loop-cli

  # rustfmt gate. "false" = report unformatted code as a warning and in the
  # job summary, but don't fail the run. The existing code base is not yet
  # rustfmt-clean (hundreds of hunks across many files), so a hard gate would
  # turn every pull request red until a one-time `cargo fmt --all` commit
  # lands. After that commit, set this to "true" to enforce it from then on.
  FMT_BLOCKING: "false"

  # clippy's ordinary (non-blocking) warnings, as a ceiling rather than just
  # a count: today's baseline is 46 (see the doc this workflow ships with).
  # A PR that pushes the count above this fails, so style/complexity debt
  # can only go down from here, never up unnoticed. Lower this number by
  # hand whenever a cleanup PR genuinely reduces the count.
  CLIPPY_WARNING_CEILING: "46"

# Runner and action versions are pinned on purpose:
# - ubuntu-24.04, not ubuntu-latest: GitHub moves `latest` to Ubuntu 26 on
#   2026-10-19, which would change tool versions with no edit to this file.
# - actions/checkout@v7: v4 runs on Node 20, which GitHub is deprecating.
jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          if cargo fmt --all --check > fmt.diff 2>&1; then
            echo "All files are rustfmt-clean." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          hunks=$(grep -c '^Diff in ' fmt.diff || true)
          files=$(grep '^Diff in ' fmt.diff | sed -E 's/^Diff in (.*):[0-9]+.*/\1/' | sort -u | wc -l | tr -d ' ')
          {
            echo "### rustfmt: ${hunks} hunk(s) in ${files} file(s) need formatting"
            echo
            echo 'Fix locally with `cargo fmt --all`.'
          } >> "$GITHUB_STEP_SUMMARY"
          head -n 200 fmt.diff

          if [ "$FMT_BLOCKING" = "true" ]; then
            echo "::error::rustfmt found ${hunks} hunk(s) in ${files} file(s). Run 'cargo fmt --all'."
            exit 1
          fi
          echo "::warning::rustfmt found ${hunks} hunk(s) in ${files} file(s); not blocking yet (FMT_BLOCKING=false in lint.yml)."

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A single cargo clippy run does both jobs that used to be two full
      # compiles: --message-format=json gives every diagnostic as structured
      # data, so the same run both (a) denies correctness/suspicious (a
      # nonzero exit means a real bug was found - fail immediately, no need
      # to count anything) and (b) counts the rest against
      # CLIPPY_WARNING_CEILING, so style/complexity debt can only shrink,
      # never grow unnoticed. jq ships on GitHub's ubuntu-24.04 runner.
      - name: Clippy (deny correctness/suspicious; ceiling on the rest)
        run: |
          set +e
          cargo clippy ${LINT_PACKAGES} --locked --all-targets --color never \
            --message-format=json -- -D clippy::correctness -D clippy::suspicious \
            >clippy.json 2>clippy.stderr
          clippy_exit=$?
          set -e

          if [ "$clippy_exit" -ne 0 ]; then
            cat clippy.stderr
            jq -r 'select(.reason=="compiler-message") | .message | select(.level=="error") | .rendered' clippy.json 2>/dev/null
            echo "::error::clippy found a correctness/suspicious issue (or failed to build) - see above."
            exit 1
          fi

          # Reconstructs "file:line:col: warning: message", the same unique
          # key --message-format=short + grep + sort -u counted before - a
          # naive dedupe on the full rendered block undercounts/overcounts:
          # it either merges distinct warnings sharing the same short text,
          # or splits one multi-line block across several "unique" lines.
          count=$(jq -r '
            select(.reason=="compiler-message") | .message | select(.level=="warning") |
            ((.spans[]? | select(.is_primary)) as $s |
             "\($s.file_name):\($s.line_start):\($s.column_start): warning: \(.message)")
          ' clippy.json 2>/dev/null | sort -u | wc -l | tr -d ' ')
          echo "### clippy: ${count} warning(s) (ceiling: ${CLIPPY_WARNING_CEILING})" >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -gt "$CLIPPY_WARNING_CEILING" ]; then
            echo "::error::clippy warning count rose to ${count}, above the ${CLIPPY_WARNING_CEILING} ceiling. Fix the new warning(s), or if this PR is a deliberate cleanup that lowers the count, update CLIPPY_WARNING_CEILING in lint.yml to match."
            exit 1
          fi
          echo "clippy reported ${count} warning(s), at or below the ${CLIPPY_WARNING_CEILING} ceiling."
